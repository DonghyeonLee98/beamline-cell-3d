<style>

  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }

  .sub { font-size: 11px; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; } #nums.open { top: auto; bottom: 170px; left: 16px; right: 16px; width: auto; max-height: 50%; overflow-y: auto; }
  #info { top: auto; bottom: 170px; left: 16px; right: 16px; width: auto; } .hint { display: none; } }

/* 261112: electrical-path / gas-flow overlay (paths.js) */

#legend.fold .lb { display: none; }

#legend .sw { flex: none; width: 14px; height: 6px; border-radius: 3px; margin-top: 6px; } #legend .ln { color: var(--ink2); font-size: 11px; margin-top: 4px; }

  border-radius: 12px; padding: 8px 10px; font-size: 12px; z-index: 6; }

#lidnote p { margin: 4px 0 0; } #lidnote .ln { color: var(--ink2); font-size: 11px; } #lidnote.fold .lb { display: none; }

<body>
<canvas id="c"></canvas>
<header>
  <div class="t">
    <h1 data-ko="빔라인 시료 셀" data-en="Beamline sample cell"></h1>
    <div class="sub" data-ko="빔을 쬐는 동안 XRF·XBIC를 재는 시료 셀이다. 건조 N₂ 가스 흐름과 광 조사를 할 수 있고, 바늘과 뒷핀으로 전극에 전기 접촉을 잡는다. 경사 필름 뚜껑은 필름 틀을 검출기 쪽(+X)으로 6.7° 기울여 검출기를 시료에 가까이 둘 수 있게 한다. · 부산대 이동현"
      data-en="Sample cell for measuring XRF and XBIC under the beam. It supports a dry N₂ gas flow and light illumination, and contacts the electrodes with needles and rear pins. The tilted-film lid tilts the film frame 6.7° toward the detector (+X) so the detector can sit closer to the sample. · Donghyeon Lee, PNU"></div>
  </div>
  <div class="top-r"><button id="lang">EN</button></div>
</header>
<div id="nums"></div>
<div id="marks"></div>
<div id="status">…</div>
<div id="info" hidden></div>
<div id="legend" hidden></div>
<div id="lidnote" hidden></div>
<div id="panel">
  <div class="row" id="lidRow"><span class="lab" data-ko="뚜껑" data-en="Lid"></span></div>
  <div class="row" id="pathsRow"><span class="lab" data-ko="경로" data-en="Paths"></span></div>
  <div class="row" id="toggles"><span class="lab" data-ko="표시" data-en="Show"></span></div>
  <div class="row" id="config"><span class="lab" data-ko="구성" data-en="Config"></span></div>
  <div class="row" id="views"><span class="lab" data-ko="보기" data-en="View"></span></div>
  <div class="row">
    <div class="sl"><span class="lab" data-ko="분해" data-en="Explode"></span><input id="explode" type="range" min="0" max="100" value="0"><output id="o-ex">0 %</output></div>
    <div class="sl"><span class="lab" data-ko="단면 X" data-en="Cut X"></span><input id="cut" type="range" min="-140" max="55" value="55" step="0.5"><output id="o-cut">–</output></div>
  </div>
  <div class="hint" data-ko="끌어서 회전 · 두 손가락/휠 확대 · 부품을 누르면 이름이 보인다. '전기 경로'·'기체 흐름'을 켜면 부품이 반투명해지고 경로가 위에 그려진다. '분해'로 부품을 펼치고 '단면 X'로 잘라 본다."
    data-en="Drag to rotate · pinch/wheel to zoom · tap a part for its name. 'Electrical paths' / 'Gas flow' make the parts see-through and draw the routes on top. 'Explode' pulls the parts apart and 'Cut X' sections the cell."></div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';
import { initPaths } from './paths.js';   // 261112: electrical paths + gas flow overlay
let paths = null;

let lang = 'ko';
const T = (ko, en) => (lang === 'ko' ? ko : en);
// materials by CAD kind (colour, metalness, roughness, opacity)
const M = {
  al_black: [0x2b2c30, 0.6, 0.45], lid: [0x34353a, 0.6, 0.45], pom: [0xeeeeea, 0, 0.55], fr4: [0x1f5c2e, 0, 0.5], sample: [0x23262e, 0.3, 0.25],
  pad: [0xd6d8dc, 0.9, 0.25], pin: [0xd4af37, 1, 0.3], screw: [0x9a9ca0, 0.9, 0.35], solder: [0xb8babd, 0.8, 0.4], silicone: [0xdcdcd0, 0, 0.8],
  kapton: [0xd98a1e, 0, 0.4, 0.85], brass: [0xc8641e, 0.85, 0.35], becu: [0x8a5a2b, 0.9, 0.3], peek: [0xcdb48a, 0, 0.6], ceramic: [0xf4f3ee, 0, 0.35],
  pet: [0xcfe6f5, 0, 0.1, 0.3], gasket: [0x9c3b30, 0, 0.8], tube: [0x55575c, 0.4, 0.5], wire: [0x3b6aa8, 0, 0.6], detector: [0x4c74b0, 0.2, 0.5, 0.45], misc: [0x888888, 0, 0.6],
  al: [0xbfc1c4, 0.7, 0.4], post_red: [0xb51a14, 0, 0.45], post_black: [0x1e1e20, 0, 0.45], adapter: [0x3a3b3f, 0.2, 0.5], plug: [0x8c8e92, 0.6, 0.4],
};
const standoff = /^스탠드오프/;   // brass, but keep the accent for plates + needles only
const GROUPS = [
  { key: 'lid', ko: '뚜껑 + 필름 + 가스켓', en: 'Lid + film + gasket', on: true, test: (m) => m.layer === 3 || m.layer === 4 },
  { key: 'arms', ko: '팔 (측정 자세)', en: 'Arms (measuring)', on: true, test: (m) => m.layer === 5 },
  { key: 'pcb', ko: 'PCB · 바인딩 포스트 · 인서트 고정', en: 'PCB + binding posts + insert screws', on: true, test: (m) => m.layer === 15 },
  { key: 'adapt', ko: '어댑터 · 바나나 플러그 (가정)', en: 'Adapters + banana plugs (assumed)', on: true, test: (m) => m.layer === 16 },
  { key: 'gas', ko: '가스 피팅', en: 'Gas fittings', on: true, test: (m) => m.layer === 10 },
  { key: 'tape', ko: '뒷면 테이프', en: 'Rear tape', on: true, test: (m) => /^뒷면 테이프/.test(m.name) },
  { key: 'det', ko: '검출기 머리 +X (가정)', en: 'Detector head +X (assumed)', on: false, test: (m) => m.set === 'det' },   // 261112: was v8_det 40° ±X; now the head matching the lid
];
const on = Object.fromEntries(GROUPS.map((g) => [g.key, g.on]));
const QS = new URLSearchParams(location.search);
// 261112: lid switch. 'tilt' = tilted-film lid (frame h 1.8 at X 6.45, 6.7°, +X lower; window Z ±6), design study before ordering, verified.
// It replaces only the lid, PET film and gasket of the r8 sets and adds two lip Kapton strips (models/v82r8_tiltlid.glb, same in 2T and 3T).
let lid = QS.get('lid') === 'r8' ? 'r8' : 'tilt';   // clean page: tilted lid + detector head on by default (?lid=r8 / ?det=0 turn them off)   // v82r8.html?lid=tilt&det=1 opens the tilted lid with the detector head
if (QS.get('det') !== '0') on.det = true;
const LIDS = [{ key: 'r8', ko: '기본 뚜껑', en: 'Standard lid' }, { key: 'tilt', ko: '경사 필름 뚜껑 (6.7°)', en: 'Tilted-film lid (6.7°)' }];
const LID_R8 = /^뚜껑|^PET|^실리콘 가스켓/;   // r8 parts the tilted lid set replaces
let cfg = QS.get('cfg') === '2t' ? '2t' : '3t';   // v82r8.html?cfg=2t&view=arm opens a given config / view
const CONFIGS = [{ key: '3t', ko: '3T (3T 판)', en: '3T (3T plate)' }, { key: '2t', ko: '2T·4T (판 B)', en: '2T·4T (plate B)' }];
let selIssue = null, showOk = false;   // clean page: no problem markers (markObjs stays empty)

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.localClippingEnabled = true;
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture; scene.environmentIntensity = 0.8;
const camera = new THREE.PerspectiveCamera(30, 1, 0.5, 4000);
const controls = new OrbitControls(camera, canvas); controls.enableDamping = true; controls.minDistance = 10; controls.maxDistance = 900;
const key = new THREE.DirectionalLight(0xffffff, 1.5); key.position.set(-150, 220, 260); scene.add(key);
const rim = new THREE.DirectionalLight(0xdfe8ff, 0.5); rim.position.set(200, 100, -220); scene.add(rim);
const root = new THREE.Group(); root.rotation.x = -Math.PI / 2; scene.add(root);    // CAD (X, Y, Z) -> three (x, z, -y): Z up, front (-Y) toward +z
const cutPlane = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 1e4);
const zPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 1e4);   // 261112: CAD Z section (three y), used by the detector-section view
const parts = [];
const statusEl = document.getElementById('status');

function mat(kind, name, ghost) {
  const s = (standoff.test(name) ? [0xb08a4a, 0.85, 0.35] : (M[kind] || M.misc));
  const p = { color: s[0], metalness: s[1], roughness: s[2], clippingPlanes: [cutPlane, zPlane] };
  const op = ghost ? 0.38 : s[3];
  if (op !== undefined) Object.assign(p, { transparent: true, opacity: op, depthWrite: false, side: THREE.DoubleSide });
  return new THREE.MeshPhysicalMaterial(p);
}
async function loadSet(file, metaFile, set, ghost) {
  const meta = await fetch(metaFile).then((r) => r.json());
  const byId = Object.fromEntries(meta.map((r) => [r.id, r]));
  const gltf = await new GLTFLoader().loadAsync(file, (e) => { if (e.total) statusEl.textContent = T('불러오는 중 ', 'Loading ') + Math.round(100 * e.loaded / e.total) + ' %'; });
  gltf.scene.updateMatrixWorld(true);
  gltf.scene.traverse((n) => {
    if (!n.isMesh) return;
    let id = n.name; let p = n; while (!byId[id] && p.parent) { p = p.parent; id = p.name; }
    const r = byId[id] || { name: id, kind: 'misc', layer: 0 };
    let geo = n.geometry; geo.deleteAttribute('color'); geo.deleteAttribute('normal'); geo = toCreasedNormals(geo, THREE.MathUtils.degToRad(32));
    const m = new THREE.Mesh(geo, mat(r.kind, r.name, ghost)); m.applyMatrix4(n.matrixWorld);
    m.userData = { name: r.name, kind: r.kind, layer: r.layer, lid: r.lid, set, base: m.position.clone(), ex: explodeOf(r.name, r.kind, r.layer) };
    if (/3T/.test(r.name) && kindAccent(r.name)) m.material.emissive = new THREE.Color(0x3a1a00);
    root.add(m); parts.push(m);
  });
}
// exploded view: offsets in CAD mm at 100 % (X, Y, Z); front of the cell = -Y, "up" from the PCB toward the lid = -Y as well
const EXPL = [
  [/^M3 널링|^다월/, [0, -62, 0]], [/^뚜껑|^실리콘 가스켓|^PET|^립 밑 캡톤/, [0, -46, 0]],
  [/^들기/, [0, -34, 0]], [/^M2 x 6/, [0, -30, 0]], [/^누름 띠|^M2 링 단자/, [0, -25, 0]], [/^M3 x|^스프링 와셔/, [0, -21, 0]], [/^팔 판/, [0, -15, 0]],
  [/^W 바늘/, [0, -11, 0]], [/^스탠드오프|^M3 너트/, [0, -6, 0]],
  [/^탠덤 웨이퍼|^Ag 앞 패드|^Ag 중간 패드|^캡톤/, [0, -5, 0]], [/^뒷면 테이프/, [0, 30, 0]], [/^인서트 POM/, [0, -3, 0]], [/^뒷핀/, [0, 6, 0]],
  [/^웨이퍼 누름/, [0, -9, 0]], [/^PCB v8|^JST|^센서 6심|^SHT45|^M2 x 10|^W 패드|^NTC/, [0, 26, 0]], [/^원터치|^PU 튜브/, [0, 0, 12]], [/^접지 링|^M3 x 6 접지/, [-10, 0, 0]], [/^바인딩 포스트|^포스트 /, [-12, 0, 0]], [/^BNC|^바나나/, [-36, 0, 0]], [/^스톱 나일론/, [0, -6, 0]], [/^셀 몸체|^검출기/, [0, 0, 0]],
];
function kindAccent(name) { return /^팔 판 3T|^W 바늘/.test(name); }
function explodeOf(name, kind, layer) { for (const [re, o] of EXPL) if (re.test(name)) return o; return [0, 0, 0]; }
const exEl = document.getElementById('explode');
function applyExplode() {
  const t = exEl.value / 100, e = t * t * (3 - 2 * t);
  document.getElementById('o-ex').textContent = exEl.value + ' %';
  for (const m of parts) { const o = m.userData.ex, b = m.userData.base; m.position.set(b.x + o[0] * e, b.y + o[1] * e, b.z + o[2] * e); }
  for (const k of markObjs) { const o = k.ex, b = k.base; k.obj.position.set(b[0] + o[0] * e, b[1] + o[1] * e, b[2] + o[2] * e); }
}
// problem markers: red dot in 3D (drawn on top) + numbered HTML badge projected each frame
const markObjs = [];
const marksEl = document.getElementById('marks');
const _v = new THREE.Vector3();
function placeMarks() {
  for (const k of markObjs) {
    const vis = k.it.cfg.includes(cfg) && (!k.it.ok || showOk || selIssue === k.it) && !(paths && (paths.on.elec || paths.on.gas)); k.obj.visible = vis;   // 261112: numbers hide under the path overlay
    if (!vis) { k.el.style.display = 'none'; continue; }
    k.obj.getWorldPosition(_v); _v.project(camera);
    if (_v.z > 1) { k.el.style.display = 'none'; continue; }
    k.el.style.display = ''; k.el.style.left = ((_v.x + 1) / 2 * innerWidth) + 'px'; k.el.style.top = ((1 - _v.y) / 2 * innerHeight - 14) + 'px';
  }
}
exEl.oninput = applyExplode;
function applyGroups() {
  for (const m of parts) {
    const u = m.userData; let vis = true;
    if (u.set === 'det') vis = on.det && u.lid === lid;
    else if (u.set === 'tiltlid') { if (lid !== 'tilt') vis = false; }
    else if (u.set !== cfg) vis = false;
    else if (lid === 'tilt' && LID_R8.test(u.name)) vis = false;
    if (vis && u.set !== 'det') for (const g of GROUPS) if (g.key !== 'det' && g.test(u) && !on[g.key]) vis = false;
    m.visible = vis;
  }
}
const cutEl = document.getElementById('cut');
function applyCut() { const v = +cutEl.value; cutPlane.constant = v >= 55 ? 1e4 : v; document.getElementById('o-cut').textContent = v >= 55 ? T('끔', 'off') : v.toFixed(1); }
cutEl.oninput = applyCut;

const VIEWS = [
  { key: 'iso', ko: '비스듬히', en: 'Oblique', pos: [-310, 215, 345], tgt: [-12, -34, 0] },
  { key: 'front', ko: '앞 (빔 쪽)', en: 'Front (beam side)', pos: [0, 0, 260], tgt: [0, 0, 0] },
  { key: 'arm', ko: '3T 판 가까이 (뚜껑 끔)', en: '3T plate close-up (lid off)', pos: [-55, -70, 80], tgt: [-13, -22, 2], lid: false },
  { key: 'rear', ko: '뒤', en: 'Rear', pos: [0, 0, -260], tgt: [0, 0, 0] },
  { key: 'posts', ko: '포스트 (−X)', en: 'Posts (−X)', pos: [-240, 20, 40], tgt: [0, 0, 0] },
  { key: 'side', ko: '옆 (+X)', en: 'Side (+X)', pos: [240, 10, 10], tgt: [0, 0, 0] },
  // 261112: CAD Z = 0 section seen from +Z (X-Y plane through the beam point) with the detector head on
  { key: 'detsec', ko: 'Z 0 단면 · 검출기', en: 'Z 0 section · detector', pos: [18, 270, 29], tgt: [18, 0, 28], zcut: true, det: true },
];
function setGroup(key, val) { on[key] = val; const i = GROUPS.findIndex((g) => g.key === key); document.querySelectorAll('#toggles button')[i].setAttribute('aria-pressed', String(val)); applyGroups(); }
function fly(v) {   // narrow (phone) screens: back the camera off so the cell fits the width
  const k = Math.max(1, 1.5 / camera.aspect), p = v.pos.map((x, i) => v.tgt[i] + (x - v.tgt[i]) * k);
  camera.position.set(...p); controls.target.set(...v.tgt); controls.update();
  zPlane.constant = v.zcut ? 0 : 1e4;
  if (v.det && !on.det) setGroup('det', true);
  if (v.lid === false && on.lid) { on.lid = false; document.querySelectorAll('#toggles button')[0].setAttribute('aria-pressed', 'false'); applyGroups(); } }

function buildUI() {
  const tg = document.getElementById('toggles'); tg.querySelectorAll('button').forEach((b) => b.remove());
  for (const g of GROUPS) { const b = document.createElement('button'); b.textContent = T(g.ko, g.en); b.setAttribute('aria-pressed', String(on[g.key]));
    b.onclick = () => { on[g.key] = !on[g.key]; b.setAttribute('aria-pressed', String(on[g.key])); applyGroups(); }; tg.append(b); }
  const cf = document.getElementById('config'); cf.querySelectorAll('button').forEach((b) => b.remove());
  for (const c of CONFIGS) { const b = document.createElement('button'); b.textContent = T(c.ko, c.en); b.setAttribute('aria-pressed', String(cfg === c.key));
    b.onclick = () => { cfg = c.key; cf.querySelectorAll('button').forEach((x, i) => x.setAttribute('aria-pressed', String(CONFIGS[i].key === cfg))); applyGroups(); }; cf.append(b); }
  const lr = document.getElementById('lidRow'); lr.querySelectorAll('button').forEach((b) => b.remove());
  for (const c of LIDS) { const b = document.createElement('button'); b.className = 'lbtn ' + c.key; b.textContent = T(c.ko, c.en); b.setAttribute('aria-pressed', String(lid === c.key));
    b.onclick = () => { lid = c.key; lr.querySelectorAll('button').forEach((x, i) => x.setAttribute('aria-pressed', String(LIDS[i].key === lid))); applyGroups(); lidNote(); }; lr.append(b); }
  const vw = document.getElementById('views'); vw.querySelectorAll('button').forEach((b) => b.remove());
  for (const v of VIEWS) { const b = document.createElement('button'); b.textContent = T(v.ko, v.en); b.onclick = () => fly(v); vw.append(b); }
  document.querySelectorAll('[data-ko]').forEach((el) => { if (el.tagName !== 'BUTTON' || el.id) el.innerHTML = el.dataset[lang]; });
  document.getElementById('lang').textContent = lang === 'ko' ? 'EN' : '한';
}
// 261112: note shown while the tilted lid is on (phones open it folded)
function lidNote() {}
function stackNote() {   // keep the info / legend boxes clear of the lid note (called every frame, cheap)
  const n = document.getElementById('lidnote'), h = n.hidden ? 0 : n.offsetHeight + 8, wide = innerWidth > 600;
  const lg = document.getElementById('legend'), inf = document.getElementById('info');
  if (wide) { lg.style.top = inf.style.top = (74 + h) + 'px'; lg.style.bottom = inf.style.bottom = n.style.bottom = document.getElementById('nums').style.bottom = ''; }
  else { const base = document.getElementById('panel').offsetHeight + 18; lg.style.top = inf.style.top = ''; n.style.bottom = base + 'px';
    inf.style.bottom = (base + h) + 'px'; lg.style.bottom = (base + h) + 'px'; document.getElementById('nums').style.bottom = (base + h) + 'px'; }
}
document.getElementById('lang').onclick = () => { lang = lang === 'ko' ? 'en' : 'ko'; document.documentElement.lang = lang; buildUI(); if (paths) paths.rebuild(); };
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(), infoEl = document.getElementById('info');
let down = null;
canvas.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(parts.filter((m) => m.visible), false)[0];
  if (!hit) { infoEl.hidden = true; return; }
  const u = hit.object.userData; infoEl.hidden = false; infoEl.innerHTML = `<div class="k">${u.name}</div><div class="n">${u.kind}</div>`;
});
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; updOffset(); }
function updOffset() { camera.clearViewOffset(); camera.updateProjectionMatrix(); }
addEventListener('resize', resize);

buildUI(); resize(); fly(VIEWS.find((v) => v.key === QS.get('view')) || VIEWS[0]); applyCut();
statusEl.textContent = T('불러오는 중 …', 'Loading …');
await loadSet('models/v82r8_3t.glb', 'models/v82r8_3t_meta.json', '3t', false);
await loadSet('models/v82r8_2t.glb', 'models/v82r8_2t_meta.json', '2t', false);
await loadSet('models/v82r8_tiltlid.glb', 'models/v82r8_tiltlid_meta.json', 'tiltlid', false);   // 261112: tilted-film lid (lid switch)
await loadSet('models/v82r8_det.glb', 'models/v82r8_det_meta.json', 'det', true);   // 261112: +X head, r8 39° D 15.18 / tilted 42° D 13.35 (assumed head)
applyGroups(); statusEl.hidden = true;
// paths drawn at the assembled position: turning one on resets the explode slider; they hide while exploded (?paths=elec,gas)
paths = await initPaths({ clean: true, root, parts, camera, getCfg: () => cfg, getLang: () => lang, row: document.getElementById('pathsRow'),
  legend: document.getElementById('legend'), marks: marksEl, exploded: () => +exEl.value > 0,
  beforeOn: () => { if (+exEl.value > 0) { exEl.value = 0; applyExplode(); } } });
for (const k of (QS.get('paths') || '').split(',')) if (paths.on[k] === false) document.querySelector('#pathsRow .pbtn.' + k).click();
renderer.setAnimationLoop(() => { controls.update(); paths.tick(); renderer.render(scene, camera); placeMarks(); stackNote(); });
</script>
</body>
