async function loadSet(file, metaFile, set, ghost) {

  gltf.scene.updateMatrixWorld(true);
  gltf.scene.traverse((n) => {
    if (!n.isMesh) return;
    let id = n.name; let p = n; while (!byId[id] && p.parent) { p = p.parent; id = p.name; }
    const r = byId[id] || { name: id, kind: 'misc', layer: 0 };
    let geo = n.geometry; geo.deleteAttribute('color'); geo.deleteAttribute('normal'); geo = toCreasedNormals(geo, THREE.MathUtils.degToRad(32));
    const m = new THREE.Mesh(geo, mat(r.kind, r.name, ghost)); m.applyMatrix4(n.matrixWorld);
    m.userData = { name: r.name, kind: r.kind, layer: r.layer, lid: r.lid, set, base: m.position.clone(), ex: explodeOf(r.name, r.kind, r.layer) };
    if (/3T/.test(r.name) && kindAccent(r.name)) m.material.emissive = new THREE.Color(0x3a1a00);

}

const dotOk = new THREE.MeshBasicMaterial({ color: 0x1e9e48, depthTest: false, transparent: true, opacity: 0.95 });
let showOk = QS.get('ok') !== '0';   // v82r8.html?ok=0 opens with the green (solved) marks hidden
for (const it of ISSUES) {
  const nm = it.ko[0];
  for (const p of it.marks) {
    const obj = new THREE.Mesh(dotGeo, it.ok ? dotOk : dotMat); obj.position.set(...p); obj.renderOrder = 999; root.add(obj);
    const el = document.createElement('span'); el.className = it.ok ? 'bn ok' : 'bn'; el.textContent = it.n; el.title = nm;
    el.onclick = (e) => { e.stopPropagation(); selectIssue(it, true); };
    marksEl.append(el);
    markObjs.push({ it, obj, el, base: p, ex: explodeOf(namePart(it.part), '', 0) });
  }
}
function namePart(re) { const s = re.source.replace(/^\^/, ''); return s; }
const _v = new THREE.Vector3();
function placeMarks() {
  for (const k of markObjs) {
    const vis = k.it.cfg.includes(cfg) && (!k.it.ok || showOk || selIssue === k.it) && !(paths && (paths.on.elec || paths.on.gas)); k.obj.visible = vis;   // 261112: numbers hide under the path overlay
    if (!vis) { k.el.style.display = 'none'; continue; }
    k.obj.getWorldPosition(_v); _v.project(camera);
    if (_v.z > 1) { k.el.style.display = 'none'; continue; }
    k.el.style.display = ''; k.el.style.left = ((_v.x + 1) / 2 * innerWidth) + 'px'; k.el.style.top = ((1 - _v.y) / 2 * innerHeight - 14) + 'px';

}
function selectIssue(it, go) {
  selIssue = it;
  if (!it.cfg.includes(cfg)) { cfg = it.cfg[0]; document.querySelectorAll('#config button').forEach((x, i) => x.setAttribute('aria-pressed', String(CONFIGS[i].key === cfg))); applyGroups(); }
  for (const k of markObjs) { const s = k.it === it; k.el.classList.toggle('sel', s); k.obj.material = s ? dotSel : (k.it.ok ? dotOk : dotMat); }
  document.querySelectorAll('#issueList li').forEach((li) => li.classList.toggle('sel', li.dataset.n === it.n));
  const iss = document.getElementById('issues'); iss.classList.add('open'); iss.classList.remove('closed'); updOffset();
  const li = document.querySelector(`#issueList li[data-n="${it.n}"]`), box = document.getElementById('issues');   // no scrollIntoView: it would scroll the page sideways
  if (li) box.scrollTop = Math.max(0, li.offsetTop - 40);
  if (!go) return;
  const k = markObjs.find((x) => x.it === it); k.obj.getWorldPosition(_v);
  const dir = camera.position.clone().sub(controls.target).normalize();
  const dist = Math.max(1, 1.2 / camera.aspect) * 150;
  controls.target.copy(_v); camera.position.copy(_v.clone().add(dir.multiplyScalar(dist))); controls.update();

}

  solved.forEach(add);

    'mm. Values from the r8 order-set report and verification reports A and B (11-11); positions from the r8 assembly. Wafer-lift values for the solved item are estimates.');
}
exEl.oninput = applyExplode;
function applyGroups() {
  for (const m of parts) {
    const u = m.userData; let vis = true;

    else if (u.set === 'tiltlid') { if (lid !== 'tilt') vis = false; }

const cutEl = document.getElementById('cut');
function applyCut() { const v = +cutEl.value; cutPlane.constant = v >= 55 ? 1e4 : v; document.getElementById('o-cut').textContent = v >= 55 ? T('끔', 'off') : v.toFixed(1); }

const VIEWS = [

  { key: 'front', ko: '앞 (빔 쪽)', en: 'Front (beam side)', pos: [0, 0, 260], tgt: [0, 0, 0] },
  { key: 'arm', ko: '3T 판 가까이 (뚜껑 끔)', en: '3T plate close-up (lid off)', pos: [-55, -70, 80], tgt: [-13, -22, 2], lid: false },
  { key: 'rear', ko: '뒤 (Grace 쪽)', en: 'Rear (Grace side)', pos: [0, 0, -260], tgt: [0, 0, 0] },
  { key: 'posts', ko: '포스트 (−X)', en: 'Posts (−X)', pos: [-240, 20, 40], tgt: [0, 0, 0] },
  { key: 'side', ko: '옆 (+X)', en: 'Side (+X)', pos: [240, 10, 10], tgt: [0, 0, 0] },
  // 261112: CAD Z = 0 section seen from +Z (X-Y plane through the beam point) with the detector head on
  { key: 'detsec', ko: 'Z 0 단면 · 검출기', en: 'Z 0 section · detector', pos: [18, 270, 29], tgt: [18, 0, 28], zcut: true, det: true },
];
function setGroup(key, val) { on[key] = val; const i = GROUPS.findIndex((g) => g.key === key); document.querySelectorAll('#toggles button')[i].setAttribute('aria-pressed', String(val)); applyGroups(); }
function fly(v) {   // narrow (phone) screens: back the camera off so the cell fits the width
  const k = Math.max(1, 1.5 / camera.aspect), p = v.pos.map((x, i) => v.tgt[i] + (x - v.tgt[i]) * k);
  camera.position.set(...p); controls.target.set(...v.tgt); controls.update();
  zPlane.constant = v.zcut ? 0 : 1e4;
  if (v.det && !on.det) setGroup('det', true);
  if (v.lid === false && on.lid) { on.lid = false; document.querySelectorAll('#toggles button')[0].setAttribute('aria-pressed', 'false'); applyGroups(); } }

function buildUI() {
  const tg = document.getElementById('toggles'); tg.querySelectorAll('button').forEach((b) => b.remove());
  for (const g of GROUPS) { const b = document.createElement('button'); b.textContent = T(g.ko, g.en); b.setAttribute('aria-pressed', String(on[g.key]));
    b.onclick = () => { on[g.key] = !on[g.key]; b.setAttribute('aria-pressed', String(on[g.key])); applyGroups(); }; tg.append(b); }
  { const b = document.createElement('button'); b.textContent = T('해결된 곳 (초록)', 'Solved (green)'); b.setAttribute('aria-pressed', String(showOk));
    b.onclick = () => { showOk = !showOk; b.setAttribute('aria-pressed', String(showOk)); }; tg.append(b); }
  const cf = document.getElementById('config'); cf.querySelectorAll('button').forEach((b) => b.remove());
  for (const c of CONFIGS) { const b = document.createElement('button'); b.textContent = T(c.ko, c.en); b.setAttribute('aria-pressed', String(cfg === c.key));
    b.onclick = () => { cfg = c.key; cf.querySelectorAll('button').forEach((x, i) => x.setAttribute('aria-pressed', String(CONFIGS[i].key === cfg))); applyGroups(); }; cf.append(b); }
  const lr = document.getElementById('lidRow'); lr.querySelectorAll('button').forEach((b) => b.remove());
  for (const c of LIDS) { const b = document.createElement('button'); b.className = 'lbtn ' + c.key; b.textContent = T(c.ko, c.en); b.setAttribute('aria-pressed', String(lid === c.key));
    b.onclick = () => { lid = c.key; lr.querySelectorAll('button').forEach((x, i) => x.setAttribute('aria-pressed', String(LIDS[i].key === lid))); applyGroups(); lidNote(); }; lr.append(b); }
  const vw = document.getElementById('views'); vw.querySelectorAll('button').forEach((b) => b.remove());
  for (const v of VIEWS) { const b = document.createElement('button'); b.textContent = T(v.ko, v.en); b.onclick = () => fly(v); vw.append(b); }
  document.querySelectorAll('[data-ko]').forEach((el) => { if (el.tagName !== 'BUTTON' || el.id) el.innerHTML = el.dataset[lang]; });
  document.getElementById('lang').textContent = lang === 'ko' ? 'EN' : '한';
  const rows = [
    [T('간섭 (측정 자세, r8): 3T 156 부품 / 2T·4T 150 부품', 'Clashes (measuring, r8): 3T 156 parts / 2T·4T 150 parts'), '0 / 0'],
    [T('웨이퍼 앞면 – 인서트 윗면 (공차 −0.025 ~ +0.125)', 'Wafer front above insert top (tol. −0.025…+0.125)'), '0.05'],
    [T('뒷핀 눌림 / 힘 (개당)', 'Rear-pin travel / force (each)'), '0.706 / 60.3 gf'],
    [T('누름 나사 머리–필름 (SCB2-6 / 팬헤드 1.6)', 'Clamp head to film (SCB2-6 / pan 1.6)'), '0.48 / 0.88'],
    [T('NTC 구멍 / 머리 (가정)', 'NTC hole / head (assumed)'), 'Ø2.6 / Ø2.41'],
    [T('팔 판 바늘 각 (황동 판 A/B)', 'Needle angle, brass plates A/B'), '10.77°'],

    [T('들기 나사 1바퀴 / 끝 올라감', 'Lift screw per turn / tip rise'), '3.80° / 0.52 mm/°'],
    [T('바늘–뚜껑 (측정 자세)', 'Needle to lid (measuring)'), '1.12'],
    [T('포스트 받침 사이 최소 (CH2–CH5, CH4–CH6; 받침 Ø14 가정)', 'Min post base gap (CH2–CH5, CH4–CH6; base Ø14 assumed)'), '0.89'],
    [T('뒷벽 관통 · 뒷면 자리', 'Rear through hole · tape recess'), 'Ø20 · Ø34 × 0.4'],

// 261112: note shown while the tilted lid is on (phones open it folded)
let noteFold = innerWidth <= 600;
function lidNote() {

  el.hidden = false;
  el.innerHTML = `<div class="lh"><b>${T('경사 필름 뚜껑 (h 1.8, 6.7°)', 'Tilted-film lid (h 1.8, 6.7°)')}<span class="tag">${T('발주 전 · 검증 완료', 'not ordered · verified')}</span></b><button>${noteFold ? T('펼치기', 'Open') : T('접기', 'Fold')}</button></div><div class="lb">` +
    `<p>${T('필름 틀(PET 접착면)을 바늘 자리(X 6.45, 높이 1.8)를 축으로 검출기 쪽(+X)으로 6.7° 기울이고, 창을 X ±30.5 × Z ±6으로 좁혔다. 판·몸체·인서트는 r8 그대로이고 뚜껑·필름·가스켓만 바뀌며 립 밑 캡톤 띠 2장이 붙는다.',
      'The film frame (PET bond plane) is tilted 6.7° down toward the detector (+X) about the needle position (X 6.45, height 1.8), and the window is narrowed to X ±30.5 × Z ±6. Plates, body and insert stay r8; only the lid, film and gasket change, plus two Kapton strips under the lip.')}</p>` +

      'With the detector at 42° the beam-point-to-head distance D drops from 15.18 (r8, 39°) to 13.35 mm, about 1.29× signal (1/D²). Kept at 40° the gain is small (14.25 vs 15.57; the beam path sets D).')}</p>` +
    `<p>${T('주의: 시료 중심에서 벗어난 자리를 잴 때는 머리가 뚜껑 Z 벽에 다가가므로 검출기를 뒤로 물려야 한다.',

  el.classList.toggle('fold', noteFold);

function stackNote() {   // keep the info / legend boxes clear of the lid note (called every frame, cheap)
  const n = document.getElementById('lidnote'), h = n.hidden ? 0 : n.offsetHeight + 8, wide = innerWidth > 600;
  const lg = document.getElementById('legend'), inf = document.getElementById('info');
  if (wide) { lg.style.top = inf.style.top = (74 + h) + 'px'; lg.style.bottom = inf.style.bottom = n.style.bottom = document.getElementById('nums').style.bottom = ''; }
  else { const base = document.getElementById('panel').offsetHeight + 18; lg.style.top = inf.style.top = ''; n.style.bottom = base + 'px';
    inf.style.bottom = (base + h) + 'px'; lg.style.bottom = (base + h) + 'px'; document.getElementById('nums').style.bottom = (base + h) + 'px'; }
}
document.getElementById('lang').onclick = () => { lang = lang === 'ko' ? 'en' : 'ko'; document.documentElement.lang = lang; buildUI(); if (paths) paths.rebuild(); };
document.getElementById('numsBtn').onclick = () => document.getElementById('nums').classList.toggle('open');
document.getElementById('issuesBtn').onclick = () => { const e = document.getElementById('issues'); const narrow = innerWidth <= 600;
  if (narrow) e.classList.toggle('open'); else e.classList.toggle('closed'); updOffset(); };
document.getElementById('issuesClose').onclick = () => { const e = document.getElementById('issues'); e.classList.remove('open'); e.classList.add('closed'); updOffset(); };

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(), infoEl = document.getElementById('info');
let down = null;
canvas.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(parts.filter((m) => m.visible), false)[0];
  if (!hit) { infoEl.hidden = true; return; }
  const u = hit.object.userData; infoEl.hidden = false; infoEl.innerHTML = `<div class="k">${u.name}</div><div class="n">${u.kind}</div>`;
});
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; updOffset(); }
// phone: while the problem list covers the lower half, shift the picture up so the selected point stays visible
function updOffset() { if (innerWidth <= 600 && document.getElementById('issues').classList.contains('open')) camera.setViewOffset(innerWidth, innerHeight, 0, Math.round(innerHeight * 0.24), innerWidth, innerHeight); else camera.clearViewOffset(); camera.updateProjectionMatrix(); }
addEventListener('resize', resize);

buildUI(); resize(); fly(VIEWS.find((v) => v.key === QS.get('view')) || VIEWS[0]); applyCut();
statusEl.textContent = T('불러오는 중 …', 'Loading …');

await loadSet('models/v82r8_2t.glb', 'models/v82r8_2t_meta.json', '2t', false);
await loadSet('models/v82r8_tiltlid.glb', 'models/v82r8_tiltlid_meta.json', 'tiltlid', false);   // 261112: tilted-film lid (lid switch)
await loadSet('models/v82r8_det.glb', 'models/v82r8_det_meta.json', 'det', true);   // 261112: +X head, r8 39° D 15.18 / tilted 42° D 13.35 (assumed head)
applyGroups(); statusEl.hidden = true;
const qi = ISSUES.find((i) => i.n === QS.get('issue')); if (qi) selectIssue(qi, true);   // v82r8.html?issue=2c (or R1) opens one problem
// paths drawn at the assembled position: turning one on resets the explode slider; they hide while exploded (?paths=elec,gas)
paths = await initPaths({ root, parts, camera, getCfg: () => cfg, getLang: () => lang, row: document.getElementById('pathsRow'),
  legend: document.getElementById('legend'), marks: marksEl, exploded: () => +exEl.value > 0,
  beforeOn: () => { if (+exEl.value > 0) { exEl.value = 0; applyExplode(); } } });
for (const k of (QS.get('paths') || '').split(',')) if (paths.on[k] === false) document.querySelector('#pathsRow .pbtn.' + k).click();
renderer.setAnimationLoop(() => { controls.update(); paths.tick(); renderer.render(scene, camera); placeMarks(); stackNote(); });
</script>
