const EXPL = { 0: [0, 0, 0], 2: [0, -16, 0], 3: [0, -32, 0], 4: [0, -48, 0], 5: [0, -64, 0], 13: [0, -64, 0], 6: [0, -96, 0], 7: [0, -96, 0], 8: [-22, 0, 0],
  9: [0, 0, 26], 10: [0, 0, -30], 11: [0, 34, 0], 12: [0, 34, 0], [-2]: [0, 48, 0], [-3]: [0, 48, 0] };
const GROUPS = [
  { key: 'lid', ko: '뚜껑 + 필름', en: 'Lid + film', on: true, test: (m) => m.layer === 6 || m.layer === 7 },
  { key: 'sensor', ko: '센서 보드', en: 'Sensor board', on: true, test: (m) => m.layer === 13 },
  { key: 'mount', ko: 'Grace 판·브래킷', en: 'Grace plate + bracket', on: true, test: (m) => m.layer === -2 || m.layer === -3 },
  { key: 'exhaust', ko: '배기 블록', en: 'Exhaust block', on: true, test: (m) => m.layer === 10 },
  { key: 'bracket', ko: '커넥터 브래킷', en: 'Connector bracket', on: true, test: (m) => m.layer === 9 },
  { key: 'wires', ko: '선', en: 'Wires', on: true, test: (m) => /^PTFE|^배선 묶음|^센서 4선/.test(m.name) },
];
const groupOn = Object.fromEntries(GROUPS.map((g) => [g.key, g.on]));

// ---------- renderer / scene
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
scene.environmentIntensity = 0.75;
const camera = new THREE.PerspectiveCamera(30, 1, 0.5, 4000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.minDistance = 12; controls.maxDistance = 900; controls.zoomSpeed = 1.1;

const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(-160, 260, 220); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.25; key.shadow.radius = 4;
Object.assign(key.shadow.camera, { left: -140, right: 140, top: 200, bottom: -60, near: 50, far: 800 });
key.target.position.set(0, 90, 0); scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0xdfe8ff, 0.5); rim.position.set(200, 120, -220); scene.add(rim);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1400, 1400), new THREE.ShadowMaterial({ opacity: 0.22 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const root = new THREE.Group(); root.rotation.x = -Math.PI / 2; scene.add(root);   // CAD → three
const cutPlane = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 1e4);   // keep x ≤ cut
let cutOn = false;

// ---------- loading
const meta = await fetch('models/v60_meta.json').then((r) => r.json());
const loader = new GLTFLoader();
const cache = {};
let cur = null, curKey = null;
const statusEl = document.getElementById('status');

function makeMat(spec) {
  const p = { color: spec.color, metalness: spec.metalness ?? 0, roughness: spec.roughness ?? 0.6, envMapIntensity: 1, clippingPlanes: [cutPlane] };
  if (spec.clearcoat) { p.clearcoat = spec.clearcoat; p.clearcoatRoughness = spec.clearcoatRoughness ?? 0.3; }
  if (spec.sheen) { p.sheen = spec.sheen; p.sheenRoughness = 0.8; p.sheenColor = new THREE.Color(0xffffff); }
  if (spec.opacity !== undefined) { p.transparent = true; p.opacity = spec.opacity; p.depthWrite = false; p.side = THREE.DoubleSide; }
  if (spec.film) { p.specularIntensity = 1; p.ior = 1.57; }
  return new THREE.MeshPhysicalMaterial(p);
}
function specOf(name, kind) {
  for (const [re, o] of OVR) if (re.test(name)) return typeof o === 'string' ? M[o] : o;
  return M[kind] || M.misc;
}

async function load(k) {
  if (cache[k]) return cache[k];
  statusEl.hidden = false; statusEl.textContent = (lang === 'ko' ? '불러오는 중 … ' : 'Loading … ');
  const gltf = await loader.loadAsync('models/v60_' + k + '.glb', (e) => { if (e.total) statusEl.textContent = (lang === 'ko' ? '불러오는 중 ' : 'Loading ') + Math.round(100 * e.loaded / e.total) + ' %'; });
  const g = new THREE.Group(); const rows = meta[k]; const parts = [];
  gltf.scene.updateMatrixWorld(true);
  const nodes = gltf.scene.children.slice();
  nodes.forEach((n, i) => {
    const mesh = n.isMesh ? n : n.getObjectByProperty('isMesh', true); if (!mesh) return;
    let geo = mesh.geometry; geo.deleteAttribute('color'); geo.deleteAttribute('normal');
    geo = toCreasedNormals(geo, THREE.MathUtils.degToRad(32));
    const as = gltf.parser.associations.get(n), jn = as && as.nodes !== undefined ? gltf.parser.json.nodes[as.nodes] : null;
    const name = (jn && jn.name) || (n.name || mesh.name).replace(/_/g, ' '), [kind, layer] = rows[i] || ['misc', 0], spec = specOf(name, kind);
    const m = new THREE.Mesh(geo, makeMat(spec));
    m.applyMatrix4(n.matrixWorld);
    const opaque = spec.opacity === undefined;
    m.castShadow = opaque; m.receiveShadow = opaque;
    m.userData = { name, kind, layer, spec, base: m.position.clone(), opaque };
    if (opaque) {   // back faces drawn flat = solid-looking cut face when the section plane is on
      const capC = new THREE.Color(spec.color).multiplyScalar(0.62);
      const cap = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: capC, side: THREE.BackSide, clippingPlanes: [cutPlane] }));
      cap.visible = false; cap.userData.cap = true; m.add(cap);
    }
    g.add(m); parts.push(m);
  });
  cache[k] = { g, parts };
  statusEl.hidden = true;
  return cache[k];
}

async function show(k) {
  const c = await load(k);
  if (cur) root.remove(cur.g);
  cur = c; curKey = k; root.add(c.g);
  select(null); applyExplode(); applyGroups(); applyCut();
  document.querySelectorAll('#variants button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.k === k)));
  writeHash();
  // warm the others in the background (phone: one at a time)
  setTimeout(() => { for (const v of VARIANTS) if (!cache[v.key]) { load(v.key); break; } }, 1500);
}

// ---------- controls
const exEl = document.getElementById('explode'), cutEl = document.getElementById('cut');
function applyExplode() {
  const t = exEl.value / 100, e = t * t * (3 - 2 * t);
  document.getElementById('o-ex').textContent = exEl.value + ' %';
  if (!cur) return;
  for (const m of cur.parts) { const o = EXPL[m.userData.layer] || [0, 0, 0]; m.position.set(m.userData.base.x + o[0] * e, m.userData.base.y + o[1] * e, m.userData.base.z + o[2] * e); }
}
function applyGroups() {
  if (!cur) return;
  for (const m of cur.parts) { let vis = true; for (const g of GROUPS) if (!groupOn[g.key] && g.test(m.userData)) vis = false; m.visible = vis; }
}
function applyCut() {
  const v = +cutEl.value; cutOn = v <= 40;
  cutPlane.constant = cutOn ? v : 1e4;
  document.getElementById('o-cut').textContent = cutOn ? 'X ' + v.toFixed(1) : (lang === 'ko' ? '끔' : 'off');
  if (cur) for (const m of cur.parts) for (const ch of m.children) if (ch.userData.cap) ch.visible = cutOn;
}
exEl.addEventListener('input', applyExplode);
cutEl.addEventListener('input', applyCut);

let anim = 0;
function fly(v, instant) {
  const t1 = cad(...v.t), c1 = cad(...v.c);
  const f = Number.isFinite(camera.aspect) && camera.aspect > 0 ? Math.min(2.2, Math.max(1, 0.95 / camera.aspect)) : 1;   // aspect is NaN while the tab is hidden (0 × 0)
  c1.sub(t1).multiplyScalar(f).add(t1);
  if (!Number.isFinite(camera.position.x)) { camera.position.copy(c1); controls.target.copy(t1); }   // never lerp from a NaN camera   // portrait (phone) screen: step back
  if (v.cut !== undefined) { cutEl.value = v.cut; applyCut(); }
  if (v.key === 'mount') { groupOn.mount = true; }
  if (v.lid !== undefined) { groupOn.lid = v.lid; }
  if (v.key === 'mount' || v.lid !== undefined) { syncToggles(); applyGroups(); }
  document.querySelectorAll('#views button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.k === v.key)));
  const t0 = controls.target.clone(), c0 = camera.position.clone(), id = ++anim, start = performance.now();
  if (instant) { controls.target.copy(t1); camera.position.copy(c1); controls.update(); return; }
  (function step(now) { if (id !== anim) return; const k = Math.min(1, (now - start) / 700), e = k * k * (3 - 2 * k);
    controls.target.lerpVectors(t0, t1, e); camera.position.lerpVectors(c0, c1, e); controls.update(); if (k < 1) requestAnimationFrame(step); })(start);
}

// ---------- picking
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(), info = document.getElementById('info');
let sel = null, down = null, lastTap = 0;
function hit(ev) {
  const r = canvas.getBoundingClientRect(); ptr.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hs = ray.intersectObjects(cur ? cur.parts.filter((m) => m.visible) : [], false);
  for (const h of hs) { if (cutOn && h.point.x > cutPlane.constant + 1e-3) continue; if (h.object.userData.spec.film) continue; return h; }
  return null;
}
function select(m) {
  if (sel) { sel.material.emissive.setHex(0x000000); }
  sel = m;
  if (!m) { info.hidden = true; return; }
  m.material.emissive.setHex(0x2a4cff); m.material.emissiveIntensity = 0.35;
  const u = m.userData, short = u.name.split(' (')[0].split(':')[0], en = enOf(u.name);
  info.innerHTML = '<button class="x" aria-label="close">×</button><div class="k"></div><div class="m"></div><div class="n"></div>';
  info.querySelector('.k').textContent = lang === 'en' && en ? en : short;
  info.querySelector('.m').textContent = u.spec[lang] || '';
  info.querySelector('.n').textContent = u.name;
  info.querySelector('.x').onclick = () => select(null);
  info.hidden = false;
}
canvas.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  const h = hit(e), now = performance.now();
  if (h && now - lastTap < 350 && sel === h.object) {   // double tap: orbit around the point
    const t0 = controls.target.clone(), d = h.point.clone().sub(t0), c0 = camera.position.clone(), id = ++anim, start = now;
    (function step(n) { if (id !== anim) return; const k = Math.min(1, (n - start) / 500), e2 = k * k * (3 - 2 * k);
      controls.target.copy(t0).addScaledVector(d, e2); camera.position.copy(c0).addScaledVector(d, e2); controls.update(); if (k < 1) requestAnimationFrame(step); })(start);
  } else select(h ? h.object : null);
  lastTap = now;
});

// ---------- UI
const vRow = document.getElementById('variants'), wRow = document.getElementById('views'), tRow = document.getElementById('toggles');
for (const v of VARIANTS) { const b = document.createElement('button'); b.dataset.k = v.key; b.dataset.ko = v.ko; b.dataset.en = v.en; b.onclick = () => show(v.key); vRow.append(b); }
for (const v of VIEWS) { const b = document.createElement('button'); b.dataset.k = v.key; b.dataset.ko = v.ko; b.dataset.en = v.en; b.onclick = () => { if (v.cut === undefined && cutOn) { cutEl.value = 41; applyCut(); } fly(v); writeHash(v.key); }; wRow.append(b); }
for (const g of GROUPS) { const b = document.createElement('button'); b.dataset.k = g.key; b.dataset.ko = g.ko; b.dataset.en = g.en; b.onclick = () => { groupOn[g.key] = !groupOn[g.key]; syncToggles(); applyGroups(); }; tRow.append(b); }
function syncToggles() { tRow.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(groupOn[b.dataset.k]))); }
syncToggles();
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-ko]').forEach((el) => { const s = el.dataset[lang]; if (/</.test(s)) el.innerHTML = s; else el.textContent = s; });
  document.getElementById('lang').textContent = lang === 'ko' ? 'EN' : '한국어';
  document.title = lang === 'ko' ? '빔라인 시료 셀 v6.0' : 'Beamline cell v6.0';
  applyCut(); if (sel) select(sel);
}
document.getElementById('lang').onclick = () => { lang = lang === 'ko' ? 'en' : 'ko'; try { localStorage.setItem('bc46-lang', lang); } catch (e) {} applyLang(); };
const panel = document.getElementById('panel');
document.getElementById('hide').onclick = () => { panel.classList.toggle('min'); const b = document.getElementById('hide'); b.dataset.ko = panel.classList.contains('min') ? '더 보기' : '접기'; b.dataset.en = panel.classList.contains('min') ? 'More' : 'Less'; applyLang(); resize(); };
let curView = 'iso';
function writeHash(view) { if (view) curView = view; try { history.replaceState(null, '', '#' + curKey + '&' + curView); } catch (e) {} }

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  if (!(w > 0 && h > 0)) return;   // hidden tab: keep the last finite aspect
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.setViewOffset(w, h, 0, Math.min(h * 0.12, panel.offsetHeight * 0.45), w, h);   // keep the model above the panel
  camera.updateProjectionMatrix();
  document.documentElement.style.setProperty('--ph', panel.offsetHeight + 'px');
}
window.addEventListener('resize', resize);

if (window.innerWidth < 600 || window.innerHeight < 700) { panel.classList.add('min'); const hb = document.getElementById('hide'); hb.dataset.ko = '더 보기'; hb.dataset.en = 'More'; }
applyLang(); resize();
const [h0, h1] = location.hash.slice(1).split('&');
const startK = VARIANTS.some((v) => v.key === h0) ? h0 : '3t', startV = VIEWS.find((v) => v.key === h1) || VIEWS[0];
await show(startK); fly(startV, true); writeHash(startV.key);

window.__bc = { camera, controls, root, renderer, scene, get cur() { return cur; } };   // for console inspection
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
