    en: ['Standoff male thread must be cut', 'Real thread 6.00 ±0.20; below the nut seat there is only a Ø4.0 × 1.2 hole + 1.0 Al (2.2 rear wall), so cut to 4.0–5.4. At 5.6 it bottoms and lifts the PCB.', 'Under the standoffs (all four)'] },
  { n: '6', cfg: BOTH, lid: false, part: /^M3 너트/, marks: [[17, 13.0, -31.5]],
    ko: ['너트 자리 모서리 R2.875 < R3.0', '긴 구멍 5.75 × 9.2, 끝 R2.875가 림에서 27.9 깊이에 대한 JLC 규칙 R3.0보다 작다 (안 되면 Ø7 둥근 자리로, 비고 B1). 너트–Al 벽 절연은 아노다이징 + 캡톤 0.06에 의존.', '몸체 너트 자리 (±17, ±31.5)'],
    en: ['Nut-seat corner R2.875 < R3.0', 'Obround 5.75 × 9.2 with R2.875 ends, below the JLC R3.0 rule at 27.9 depth (fallback Ø7 round pocket, note B1). Nut-to-Al insulation relies on anodising + 0.06 Kapton.', 'Body nut seats (±17, ±31.5)'] },
  { n: '7', cfg: BOTH, lid: false, part: /^스톱 나일론/, marks: [[32.85, -6.8, 26.89]],
    ko: ['멈춤 나사가 놀 수 있음', '나일론 M2 × 20: 머리는 손가락 위 0.2, 끝은 탭 바닥 위 0.8 떠 있어 조여지는 면이 없다 → 탭에서 놀 수 있음 (놀면 나사 고정제). 판은 가볍게 대고 손을 뗀다: 0.3 N 넘게 밀면 나사가 휘어 (끝 0.64) 바늘이 패드 밖. 바깥지름 1.93 가정 (실물 미측정).', '멈춤 나사 (네 곳)'],
    en: ['Stop screw can wobble', 'Nylon M2 × 20 is not clamped (head 0.2 above the finger, tip 0.8 above the tap bottom). Touch the plate on lightly: above 0.3 N it bends (0.64 at the tip) and the needle leaves the pad. Ø1.93 assumed.', 'Stop screws (four)'] },
  { n: '8', cfg: BOTH, lid: false, part: /^탠덤 웨이퍼/, marks: [[6.45, 0.48, -6.45]],
    ko: ['바늘 끝: 테이퍼 미확인, 패드를 팜', 'Ossila 바늘 테이퍼 길이 미확인 (모델 2.0 가정). 2.5 이상이어야 늘 끝점이 닿고, 짧으면 원뿔 어깨가 먼저 닿아 패드 밖이 된다. 뾰족한 끝이 Ag 패드를 파므로 접촉 확인 뒤 0.1~0.2만 더 누른다 (들기 나사 18~36°).', '바늘 끝 · Ag 패드 [+X−Z]'],
    en: ['Needle tip: taper unknown, digs the pad', 'Ossila taper length unknown (2.0 assumed); ≥ 2.5 needed or the cone shoulder touches first, off the pad. The sharp tip digs the Ag pad: press only 0.1–0.2 past first contact.', 'Needle tip · Ag pad [+X−Z]'] },
  { n: '9', cfg: BOTH, lid: false, part: /^W 바늘/, marks: [[11.6, -1.9, 15.3]],
    ko: ['판을 든 채로도 뚜껑이 닫힘', '들기 1바퀴 (3.8°)에서 바늘–뚜껑 0.125~0.235라 판을 든 채로도 뚜껑이 닫힌다 (4.3°부터 닿음, 3T 판 5.7°). 접촉 없이 닫힐 수 있으니 닫기 전 네 판 모두 내렸는지·접촉 저항을 확인한다.', '팔 판 앞쪽 바늘–뚜껑 틀 (측정 자세 1.12)'],
    en: ['Lid closes over a lifted plate', 'At one lift turn (3.8°) the needle clears the lid by 0.125–0.235, so the lid closes over lifted plates (contact from 4.3°, 3T 5.7°). Check all four are lowered and in contact before closing.', 'Front of an arm plate, needle to lid frame (1.12 measuring)'] },
];
let selIssue = null;

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.localClippingEnabled = true;
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture; scene.environmentIntensity = 0.8;
const camera = new THREE.PerspectiveCamera(30, 1, 0.5, 4000);
const controls = new OrbitControls(camera, canvas); controls.enableDamping = true; controls.minDistance = 10; controls.maxDistance = 900;
const key = new THREE.DirectionalLight(0xffffff, 1.5); key.position.set(-150, 220, 260); scene.add(key);
const rim = new THREE.DirectionalLight(0xdfe8ff, 0.5); rim.position.set(200, 100, -220); scene.add(rim);
const root = new THREE.Group(); root.rotation.x = -Math.PI / 2; scene.add(root);    // CAD (X, Y, Z) -> three (x, z, -y): Z up, front (-Y) toward +z
const cutPlane = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 1e4);
const parts = [];
const statusEl = document.getElementById('status');

function mat(kind, name, ghost) {
  const s = (standoff.test(name) ? [0xb08a4a, 0.85, 0.35] : (M[kind] || M.misc));
  const p = { color: s[0], metalness: s[1], roughness: s[2], clippingPlanes: [cutPlane] };
  const op = ghost ? 0.38 : s[3];
  if (op !== undefined) Object.assign(p, { transparent: true, opacity: op, depthWrite: false, side: THREE.DoubleSide });
  return new THREE.MeshPhysicalMaterial(p);
}
async function loadSet(file, metaFile, set, ghost) {
  const meta = await fetch(metaFile).then((r) => r.json());
  const byId = Object.fromEntries(meta.map((r) => [r.id, r]));
  const gltf = await new GLTFLoader().loadAsync(file, (e) => { if (e.total) statusEl.textContent = T('불러오는 중 ', 'Loading ') + Math.round(100 * e.loaded / e.total) + ' %'; });
  gltf.scene.updateMatrixWorld(true);
  gltf.scene.traverse((n) => {
    if (!n.isMesh) return;
    let id = n.name; let p = n; while (!byId[id] && p.parent) { p = p.parent; id = p.name; }
    const r = byId[id] || { name: id, kind: 'misc', layer: 0 };
    let geo = n.geometry; geo.deleteAttribute('color'); geo.deleteAttribute('normal'); geo = toCreasedNormals(geo, THREE.MathUtils.degToRad(32));
    const m = new THREE.Mesh(geo, mat(r.kind, r.name, ghost)); m.applyMatrix4(n.matrixWorld);
    m.userData = { name: r.name, kind: r.kind, layer: r.layer, set, base: m.position.clone(), ex: explodeOf(r.name, r.kind, r.layer) };
    if (/3T/.test(r.name) && kindAccent(r.name)) m.material.emissive = new THREE.Color(0x3a1a00);
    root.add(m); parts.push(m);
  });
}
// exploded view: offsets in CAD mm at 100 % (X, Y, Z); front of the cell = -Y, "up" from the PCB toward the lid = -Y as well
const EXPL = [
  [/^M3 널링|^다월/, [0, -62, 0]], [/^뚜껑|^실리콘 가스켓|^PET/, [0, -46, 0]],
  [/^들기/, [0, -34, 0]], [/^M2 x 6/, [0, -30, 0]], [/^누름 띠|^M2 링 단자/, [0, -25, 0]], [/^M3 x|^스프링 와셔/, [0, -21, 0]], [/^팔 판/, [0, -15, 0]],
  [/^W 바늘/, [0, -11, 0]], [/^스탠드오프|^M3 너트/, [0, -6, 0]],
  [/^탠덤 웨이퍼|^Ag 앞 패드|^Ag 중간 패드|^캡톤/, [0, -5, 0]], [/^뒷면 테이프/, [0, 30, 0]], [/^인서트 POM/, [0, -3, 0]], [/^뒷핀/, [0, 6, 0]],
  [/^PCB v8|^JST|^센서 6심|^SHT45|^M2 x 10|^W 패드/, [0, 26, 0]], [/^원터치|^PU 튜브/, [0, 0, 12]], [/^접지 링|^M3 x 6 접지/, [-10, 0, 0]], [/^바인딩 포스트|^포스트 /, [-12, 0, 0]], [/^BNC|^바나나/, [-36, 0, 0]], [/^스톱 나일론/, [0, -6, 0]], [/^셀 몸체|^검출기/, [0, 0, 0]],
];
function kindAccent(name) { return /^팔 판 3T|^W 바늘/.test(name); }
function explodeOf(name, kind, layer) { for (const [re, o] of EXPL) if (re.test(name)) return o; return [0, 0, 0]; }
const exEl = document.getElementById('explode');
function applyExplode() {
  const t = exEl.value / 100, e = t * t * (3 - 2 * t);
  document.getElementById('o-ex').textContent = exEl.value + ' %';
  for (const m of parts) { const o = m.userData.ex, b = m.userData.base; m.position.set(b.x + o[0] * e, b.y + o[1] * e, b.z + o[2] * e); }
  for (const k of markObjs) { const o = k.ex, b = k.base; k.obj.position.set(b[0] + o[0] * e, b[1] + o[1] * e, b[2] + o[2] * e); }
}
// problem markers: red dot in 3D (drawn on top) + numbered HTML badge projected each frame
const markObjs = [];
const marksEl = document.getElementById('marks');
const dotGeo = new THREE.SphereGeometry(0.9, 16, 12);
const dotMat = new THREE.MeshBasicMaterial({ color: 0xff2020, depthTest: false, transparent: true, opacity: 0.95 });
const dotSel = new THREE.MeshBasicMaterial({ color: 0xffd400, depthTest: false, transparent: true, opacity: 0.95 });
for (const it of ISSUES) {
  const nm = it.ko[0];
  for (const p of it.marks) {
    const obj = new THREE.Mesh(dotGeo, dotMat); obj.position.set(...p); obj.renderOrder = 999; root.add(obj);
    const el = document.createElement('span'); el.className = 'bn'; el.textContent = it.n; el.title = nm;
    el.onclick = (e) => { e.stopPropagation(); selectIssue(it, true); };
    marksEl.append(el);
    markObjs.push({ it, obj, el, base: p, ex: explodeOf(namePart(it.part), '', 0) });
  }
}
function namePart(re) { const s = re.source.replace(/^\^/, ''); return s; }
const _v = new THREE.Vector3();
function placeMarks() {
  for (const k of markObjs) {
    const vis = k.it.cfg.includes(cfg); k.obj.visible = vis;
    if (!vis) { k.el.style.display = 'none'; continue; }
    k.obj.getWorldPosition(_v); _v.project(camera);
    if (_v.z > 1) { k.el.style.display = 'none'; continue; }
    k.el.style.display = ''; k.el.style.left = ((_v.x + 1) / 2 * innerWidth) + 'px'; k.el.style.top = ((1 - _v.y) / 2 * innerHeight - 14) + 'px';
  }
}
function selectIssue(it, go) {
  selIssue = it;
  if (!it.cfg.includes(cfg)) { cfg = it.cfg[0]; document.querySelectorAll('#config button').forEach((x, i) => x.setAttribute('aria-pressed', String(CONFIGS[i].key === cfg))); applyGroups(); }
  for (const k of markObjs) { const s = k.it === it; k.el.classList.toggle('sel', s); k.obj.material = s ? dotSel : dotMat; }
  document.querySelectorAll('#issueList li').forEach((li) => li.classList.toggle('sel', li.dataset.n === it.n));
  const iss = document.getElementById('issues'); iss.classList.add('open'); iss.classList.remove('closed'); updOffset();
  const li = document.querySelector(`#issueList li[data-n="${it.n}"]`), box = document.getElementById('issues');   // no scrollIntoView: it would scroll the page sideways
  if (li) box.scrollTop = Math.max(0, li.offsetTop - 40);
  if (!go) return;
  const k = markObjs.find((x) => x.it === it); k.obj.getWorldPosition(_v);
  const dir = camera.position.clone().sub(controls.target).normalize();
  const dist = Math.max(1, 1.2 / camera.aspect) * 150;
  controls.target.copy(_v); camera.position.copy(_v.clone().add(dir.multiplyScalar(dist))); controls.update();
  if (it.lid === false && on.lid) { on.lid = false; document.querySelectorAll('#toggles button')[0].setAttribute('aria-pressed', 'false'); applyGroups(); }
}
function buildIssues() {
  document.getElementById('issuesTitle').textContent = T('문제점', 'Problems') + ` (${new Set(ISSUES.map((i) => parseInt(i.n, 10))).size})`;
  const ol = document.getElementById('issueList'); ol.innerHTML = '';
  for (const it of ISSUES) {
    const t = lang === 'ko' ? it.ko : it.en, li = document.createElement('li'); li.dataset.n = it.n;
    const only = it.cfg.length === 1 ? (lang === 'ko' ? ' · 3T 구성만' : ' · 3T only') : '';
    li.innerHTML = `<div class="h"><span class="bn">${it.n}</span>${t[0]}</div><div class="w">${t[2]}${only}</div><div class="d">${t[1]}</div>`;
    if (selIssue === it) li.classList.add('sel');
    li.onclick = () => selectIssue(it, true); ol.append(li);
  }
  document.getElementById('issuesHint').textContent = T('mm. 수치는 r6a 보고 · A 조립 검증 · B 재검 보고(11-11). 좌표는 r6 조립(beamline_wholecell_v82_r6_261111)에서 구함.',
    'mm. Values from the r6a report and verification reports A and B (11-11); positions from the r6 assembly.');
}
exEl.oninput = applyExplode;
function applyGroups() {
  for (const m of parts) {
    const u = m.userData; let vis = true;
    if (u.set === 'det') vis = on.det;
    else if (u.set !== cfg) vis = false;
    else for (const g of GROUPS) if (g.key !== 'det' && g.test(u) && !on[g.key]) vis = false;
    m.visible = vis;
  }
}
const cutEl = document.getElementById('cut');
function applyCut() { const v = +cutEl.value; cutPlane.constant = v >= 55 ? 1e4 : v; document.getElementById('o-cut').textContent = v >= 55 ? T('끔', 'off') : v.toFixed(1); }
cutEl.oninput = applyCut;

const VIEWS = [
  { key: 'iso', ko: '비스듬히', en: 'Oblique', pos: [-230, 160, 250], tgt: [-30, 0, 0] },
  { key: 'front', ko: '앞 (빔 쪽)', en: 'Front (beam side)', pos: [0, 0, 260], tgt: [0, 0, 0] },
  { key: 'arm', ko: '3T 판 가까이 (뚜껑 끔)', en: '3T plate close-up (lid off)', pos: [-55, -70, 80], tgt: [-13, -22, 2], lid: false },
  { key: 'rear', ko: '뒤 (Grace 쪽)', en: 'Rear (Grace side)', pos: [0, 0, -260], tgt: [0, 0, 0] },
  { key: 'posts', ko: '포스트 (−X)', en: 'Posts (−X)', pos: [-240, 20, 40], tgt: [0, 0, 0] },
  { key: 'side', ko: '옆 (+X)', en: 'Side (+X)', pos: [240, 10, 10], tgt: [0, 0, 0] },
];
function fly(v) {   // narrow (phone) screens: back the camera off so the cell fits the width
  const k = Math.max(1, 1.5 / camera.aspect), p = v.pos.map((x, i) => v.tgt[i] + (x - v.tgt[i]) * k);
  camera.position.set(...p); controls.target.set(...v.tgt); controls.update();
  if (v.lid === false && on.lid) { on.lid = false; document.querySelectorAll('#toggles button')[0].setAttribute('aria-pressed', 'false'); applyGroups(); } }

function buildUI() {
  const tg = document.getElementById('toggles'); tg.querySelectorAll('button').forEach((b) => b.remove());
  for (const g of GROUPS) { const b = document.createElement('button'); b.textContent = T(g.ko, g.en); b.setAttribute('aria-pressed', String(on[g.key]));
    b.onclick = () => { on[g.key] = !on[g.key]; b.setAttribute('aria-pressed', String(on[g.key])); applyGroups(); }; tg.append(b); }
  const cf = document.getElementById('config'); cf.querySelectorAll('button').forEach((b) => b.remove());
  for (const c of CONFIGS) { const b = document.createElement('button'); b.textContent = T(c.ko, c.en); b.setAttribute('aria-pressed', String(cfg === c.key));
    b.onclick = () => { cfg = c.key; cf.querySelectorAll('button').forEach((x, i) => x.setAttribute('aria-pressed', String(CONFIGS[i].key === cfg))); applyGroups(); }; cf.append(b); }
  const vw = document.getElementById('views'); vw.querySelectorAll('button').forEach((b) => b.remove());
  for (const v of VIEWS) { const b = document.createElement('button'); b.textContent = T(v.ko, v.en); b.onclick = () => fly(v); vw.append(b); }
  document.querySelectorAll('[data-ko]').forEach((el) => { if (el.tagName !== 'BUTTON' || el.id) el.innerHTML = el.dataset[lang]; });
  document.getElementById('lang').textContent = lang === 'ko' ? 'EN' : '한';
  const rows = [
    [T('간섭 (측정 자세, r6): 3T 150 부품 / 2T·4T 144 부품', 'Clashes (measuring, r6): 3T 150 parts / 2T·4T 144 parts'), '0 / 0'],
    [T('팔 판 바늘 각 (황동 판 A/B)', 'Needle angle, brass plates A/B'), '10.77°'],
    [T('3T 바늘 각 MF / MS (자를 길이 28.6 / 29.3)', '3T needle angle MF / MS (cut to 28.6 / 29.3)'), '12.14° / 11.87°'],
    [T('들기 나사 1바퀴 / 끝 올라감', 'Lift screw per turn / tip rise'), '3.80° / 0.52 mm/°'],
    [T('바늘–뚜껑 (측정 자세)', 'Needle to lid (measuring)'), '1.12'],
    [T('포스트 받침 사이 최소 (CH2–CH5, CH4–CH6; 받침 Ø14 가정)', 'Min post base gap (CH2–CH5, CH4–CH6; base Ø14 assumed)'), '0.89'],
    [T('뒷벽 관통 · 뒷면 자리', 'Rear through hole · tape recess'), 'Ø20 · Ø34 × 0.4'],
    [T('몸체 질량', 'Body mass'), '0.332 kg'],
  ];
  document.getElementById('nums').innerHTML = '<table>' + rows.map((r) => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('') + '</table>' +
    `<div class="hint">${T('mm. CAD 검사값 (beamline_wholecell_v82_r6_261111.json, A 보고).', 'mm. CAD check values (beamline_wholecell_v82_r6_261111.json, report A).')}</div>`;
  buildIssues();
}
document.getElementById('lang').onclick = () => { lang = lang === 'ko' ? 'en' : 'ko'; document.documentElement.lang = lang; buildUI(); };
document.getElementById('numsBtn').onclick = () => document.getElementById('nums').classList.toggle('open');
document.getElementById('issuesBtn').onclick = () => { const e = document.getElementById('issues'); const narrow = innerWidth <= 600;
  if (narrow) e.classList.toggle('open'); else e.classList.toggle('closed'); updOffset(); };
document.getElementById('issuesClose').onclick = () => { const e = document.getElementById('issues'); e.classList.remove('open'); e.classList.add('closed'); updOffset(); };

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(), infoEl = document.getElementById('info');
let down = null;
canvas.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(parts.filter((m) => m.visible), false)[0];
  if (!hit) { infoEl.hidden = true; return; }
  const u = hit.object.userData; infoEl.hidden = false; infoEl.innerHTML = `<div class="k">${u.name}</div><div class="n">${u.kind}</div>`;
});
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; updOffset(); }
// phone: while the problem list covers the lower half, shift the picture up so the selected point stays visible
function updOffset() { if (innerWidth <= 600 && document.getElementById('issues').classList.contains('open')) camera.setViewOffset(innerWidth, innerHeight, 0, Math.round(innerHeight * 0.24), innerWidth, innerHeight); else camera.clearViewOffset(); camera.updateProjectionMatrix(); }
addEventListener('resize', resize);

buildUI(); resize(); fly(VIEWS.find((v) => v.key === QS.get('view')) || VIEWS[0]); applyCut();
statusEl.textContent = T('불러오는 중 …', 'Loading …');
await loadSet('models/v82r6_3t.glb', 'models/v82r6_3t_meta.json', '3t', false);
await loadSet('models/v82r6_2t.glb', 'models/v82r6_2t_meta.json', '2t', false);
await loadSet('models/v8_det.glb', 'models/v8_det_meta.json', 'det', true);
applyGroups(); statusEl.hidden = true;
const qi = ISSUES.find((i) => i.n === QS.get('issue')); if (qi) selectIssue(qi, true);   // v82r6.html?issue=3c opens one problem
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); placeMarks(); });
</script>
