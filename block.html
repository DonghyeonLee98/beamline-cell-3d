// v6.2b block math (same formulas as build_beamline_wholecell_v62.py: frame / pose / needle_world / contact_y / set_screw_world / needle_film_margin)
// CAD frame: X right (seen from the beam), Y = beam direction (wafer front ~ Y 0.5), Z up (sample centre Z 0 here).
const BM = (() => {
  const v = (x, y, z) => [x, y, z];
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const rotAx = (vv, k, t) => add(add(mul(vv, Math.cos(t)), mul(cross(k, vv), Math.sin(t))), mul(k, dot(k, vv) * (1 - Math.cos(t))));
  const R = Math.PI / 180;
  function frame(site) {
    const sg = site.pad[1] > 0 ? 1 : -1, th = site.theta * R, ph = site.phi * R;
    const h = v(Math.sin(ph), 0, sg * Math.cos(ph));
    const a = add(mul(h, Math.cos(th)), mul(v(0, -1, 0), Math.sin(th)));
    let s = v(h[2], 0, -h[0]);
    let U = cross(a, s);
    if (U[1] > 0) { U = mul(U, -1); s = mul(s, -1); }
    return { a, s, U };
  }
  function pose(site, P, rot, tilt) {
    let { a, s, U } = frame(site);
    let B0 = site.B0.slice();
    if (tilt) {
      const P0 = add(B0, mul(a, P.pivot_a));
      const sense = rotAx(a, s, 0.01)[1] < a[1] ? 1 : -1;
      const t = sense * tilt * R;
      a = rotAx(a, s, t); U = rotAx(U, s, t);
      B0 = sub(P0, mul(a, P.pivot_a));
    }
    if (rot) {
      const d = rot * R, Y = v(0, 1, 0), C = v(site.B0[0], 0, site.B0[2]);
      a = rotAx(a, Y, d); s = rotAx(s, Y, d); U = rotAx(U, Y, d);
      B0 = add(C, rotAx(sub(B0, C), Y, d));
    }
    return { B0, a, s, U };
  }
  function needle(site, P, rot, tilt, slide) {
    const p = pose(site, P, rot, tilt);
    const Pc = add(add(p.B0, mul(p.U, P.h_axis)), mul(p.s, P.s_needle));
    const Lb = site.Lb + (slide || 0);
    const tip = sub(Pc, mul(p.a, Lb));
    return { tip, A: p.a, Pc, pose: p, L: site.L + (slide || 0) };
  }
  function contactY(site, P, rot, tilt) {
    const { B0, U } = pose(site, P, rot, tilt), q = site.pogo;
    return B0[1] - (U[0] * (q[0] - B0[0]) + U[2] * (q[1] - B0[2])) / U[1];
  }
  function setScrew(site, P, rot, tilt) {
    const { B0, a, s, U } = pose(site, P, rot, tilt);
    const Pp = add(add(B0, mul(a, P.push[0])), mul(s, P.push[1]));
    return (P.seat_top_Y - Pp[1]) / (-U[1]);
  }
  function tiltForTurns(site, P, rot, turns) {
    const e0 = setScrew(site, P, rot, 0), target = e0 + P.pitch * turns;
    let lo = -8, hi = 8;
    const f = (t) => setScrew(site, P, rot, t) - target;
    const flo = f(lo);
    for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if ((f(m) > 0) === (flo > 0)) lo = m; else hi = m; }
    return (lo + hi) / 2;
  }
  function filmMargin(tip, A, W) {
    let worst = 1e9;
    for (let i = 0; i <= 3200; i++) {
      const t = i * 0.01, x = tip[0] + t * A[0], y = tip[1] + t * A[1], z = tip[2] + t * A[2], az = Math.abs(z);
      if (x >= W.x0 && x <= W.x1 && az <= W.hz) worst = Math.min(worst, (y - W.d / 2) - (W.y_film + W.film_t));
      else if (x >= W.x0 - W.ledge - 3.5 && x <= W.x1 + W.ledge + 0.5 && az <= W.hz + W.ledge + 0.5) worst = Math.min(worst, (y - W.d / 2) - (W.y_film + W.tape_t + W.film_t));
      else if (x >= W.x0 - W.ledge - 3.5 && x <= W.x1 + W.ledge + W.wall + 0.5 && az <= W.hz + W.ledge + W.wall + 0.5) worst = Math.min(worst, (y - W.d / 2) - (W.y_film - W.ledge_t));
    }
    return Math.round(worst * 1000) / 1000;
  }
  return { frame, pose, needle, contactY, setScrew, tiltForTurns, filmMargin, add, sub, mul, dot, cross };
})();

"tail":1.0,"E_becu":130000.0,"E_w":400000.0,"pad_d":1.6,"pogo_reach":12.2,"pcb_Y":10.0};
</script>
<script type="importmap">

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const P = DATA.params, W = DATA.well;
let lang = 'ko';
try { const s = localStorage.getItem('bc-block-lang'); if (s === 'en' || s === 'ko') lang = s; } catch (e) {}
const $ = (id) => document.getElementById(id);
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-ko]').forEach((el) => { el.innerHTML = el.dataset[lang]; });
  $('lang').textContent = lang === 'ko' ? 'EN' : '한';
  update();
}
$('lang').onclick = () => { lang = lang === 'ko' ? 'en' : 'ko'; try { localStorage.setItem('bc-block-lang', lang); } catch (e) {} applyLang(); };
for (const k of Object.keys(DATA.sites)) { const o = document.createElement('option'); o.value = k; o.textContent = k; $('site').append(o); }
$('site').value = DATA.default_site;

// ---------------- scene (CAD (x, y, z) -> three (x, z, -y))
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 500);
const controls = new OrbitControls(camera, canvas); controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8090a0, 1.2));
const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(-40, 80, 60); scene.add(key);
const root = new THREE.Group(); root.rotation.x = -Math.PI / 2; scene.add(root);
const mat = (c, o) => new THREE.MeshStandardMaterial({ color: c, metalness: o && o.m || 0.2, roughness: o && o.r || 0.5, transparent: !!(o && o.t), opacity: o && o.t || 1, depthWrite: !(o && o.t), side: o && o.t ? THREE.DoubleSide : THREE.FrontSide });
const M = { sus: mat(0xb8bcc2, { m: 0.8, r: 0.35 }), peek: mat(0xcbb38a, { r: 0.7 }), al: mat(0x3a3d42, { m: 0.5, r: 0.6 }), screw: mat(0x6b6f75, { m: 0.8, r: 0.4 }),
  needleFree: mat(0xd29a2e, { m: 0.9, r: 0.3 }), needleFixed: mat(0x2f9e57, { m: 0.6, r: 0.35 }), pogo: mat(0xd8dade, { m: 0.9, r: 0.25 }), pad: mat(0xe5e7ea, { m: 0.9, r: 0.2 }),
  wafer: mat(0x2c3340, { r: 0.4 }), film: mat(0x9fd3ff, { t: 0.25 }), warn: mat(0xf97316, { r: 0.5 }) };
const G = {};
function cylBetween(p0, p1, r, m) {
  const a = new THREE.Vector3(...p0), b = new THREE.Vector3(...p1), d = b.clone().sub(a), L = d.length();
  const g = new THREE.Mesh(new THREE.CylinderGeometry(r, r, L, 20), m);
  g.position.copy(a.clone().add(b).multiplyScalar(0.5));
  g.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  return g;
}
function boxLocal(pose, a0, a1, s0, s1, u0, u1, m) {
  const g = new THREE.Mesh(new THREE.BoxGeometry(a1 - a0, s1 - s0, u1 - u0), m);
  const B = new THREE.Matrix4().makeBasis(new THREE.Vector3(...pose.a), new THREE.Vector3(...pose.s), new THREE.Vector3(...pose.U));
  const c = BM.add(BM.add(BM.add(pose.B0, BM.mul(pose.a, (a0 + a1) / 2)), BM.mul(pose.s, (s0 + s1) / 2)), BM.mul(pose.U, (u0 + u1) / 2));
  B.setPosition(c[0], c[1], c[2]);
  g.applyMatrix4(B);
  return g;
}
const dyn = new THREE.Group(); root.add(dyn);
function clearDyn() { while (dyn.children.length) { const o = dyn.children.pop(); o.geometry && o.geometry.dispose(); } }

// ---------------- state
const st = { clamp: 1, slide: 0, turns: 0, rot: 0, lock: false, mat: 'becu' };
['clamp', 'slide', 'turns', 'rot'].forEach((k) => { $(k).oninput = () => { st[k] = parseFloat($(k).value); update(); }; });
$('lock').onclick = () => { st.lock = !st.lock; update(); };
$('mat-becu').onclick = () => { st.mat = 'becu'; update(); };
$('mat-w').onclick = () => { st.mat = 'w'; update(); };
$('site').onchange = () => { st.slide = 0; st.turns = 0; st.rot = 0; $('slide').value = 0; $('turns').value = 0; $('rot').value = 0; frameCam(); update(); };
const f2 = (x) => (x >= 0 ? '+' : '') + x.toFixed(2);
const T = (ko, en) => (lang === 'ko' ? ko : en);

function update() {
  const site = DATA.sites[$('site').value];
  const fixed = st.clamp >= 0.8;
  $('slide').disabled = fixed;
  $('rot').disabled = st.lock;
  $('lock').setAttribute('aria-pressed', String(st.lock)); $('lock').textContent = st.lock ? T('잠김', 'Locked') : T('풀림', 'Free');
  $('lockmsg').textContent = st.lock ? T('회전 슬라이더 막힘', 'turn slider disabled') : '';
  $('mat-becu').setAttribute('aria-pressed', String(st.mat === 'becu')); $('mat-w').setAttribute('aria-pressed', String(st.mat === 'w'));
  const tilt = BM.tiltForTurns(site, P, st.rot, st.turns);
  const nd = BM.needle(site, P, st.rot, tilt, st.slide);
  const tip = nd.tip, A = nd.A, pose = nd.pose;
  const ang = Math.asin(-A[1]) * 180 / Math.PI;
  const film = BM.filmMargin(tip, A, W);
  const padY = site.padY;
  const dY = tip[1] - padY;                                // + = unloaded tip past the pad plane (preload)
  const dpad = Math.hypot(tip[0] - site.padTrue[0], tip[2] - site.padTrue[1]);
  const inPad = dpad <= DATA.pad_d / 2;
  const E = st.mat === 'becu' ? DATA.E_becu : DATA.E_w, I = Math.PI * Math.pow(DATA.needle_d, 4) / 64, k = 3 * E * I / Math.pow(nd.L, 3);
  const F = k * Math.max(dY, 0);
  const yc = BM.contactY(site, P, st.rot, tilt), comp = DATA.pogo_reach - (DATA.pcb_Y - yc);
  const tiltOut = Math.abs(tilt) > P.range + 1e-6 || film < 0.3;
  $('o-clamp').textContent = fixed ? T('고정', 'fixed') : st.clamp.toFixed(2);
  $('o-slide').textContent = f2(st.slide) + ' mm';
  $('o-turns').textContent = f2(st.turns) + ' → ' + (site.theta + tilt).toFixed(1) + '°';
  $('o-turns').className = tiltOut ? 'warn' : '';
  $('o-rot').textContent = f2(st.rot) + '°';
  const rows = [
    [T('팁 X, Z', 'Tip X, Z'), tip[0].toFixed(2) + ', ' + tip[2].toFixed(2)],
    [T('팁 Y (패드 면 대비)', 'Tip Y (vs pad plane)'), f2(dY) + ' mm', dY < 0 ? 'warn' : ''],
    [T('패드 중심까지', 'To pad centre'), dpad.toFixed(2) + ' mm ' + (inPad ? T('(패드 안)', '(on pad)') : T('(패드 밖)', '(off pad)')), inPad ? 'good' : 'warn'],
    [T('바늘 각', 'Needle angle'), ang.toFixed(2) + '°'],
    [T('바늘–필름 최소 여유', 'Needle–film min. gap'), film.toFixed(2) + ' mm', film < 0.3 ? 'warn' : 'good'],
    [T('자유 길이', 'Free length'), nd.L.toFixed(2) + ' mm'],
    [T('예압 힘', 'Preload force') + ' (' + (st.mat === 'becu' ? 'BeCu' : 'W') + ')', F.toFixed(3) + ' N (k ' + k.toFixed(3) + ' N/mm)'],
    [T('포고 눌림', 'Spring-pin compression'), comp.toFixed(2) + ' mm', comp < 0.7 || comp > 1.0 ? 'warn' : ''],
    [T('세트스크류 돌출', 'Set-screw protrusion'), BM.setScrew(site, P, st.rot, tilt).toFixed(2) + ' mm'],
  ];
  $('tbl').innerHTML = rows.map((r) => `<tr><td>${r[0]}</td><td class="${r[2] || ''}">${r[1]}</td></tr>`).join('');
  // geometry
  clearDyn();
  const nm = fixed ? M.needleFixed : M.needleFree;
  dyn.add(boxLocal(pose, P.front, P.back, -P.blk_s / 2, P.blk_s / 2, 0, P.blk_h, M.sus));
  dyn.add(boxLocal(pose, P.front, P.back, -P.blk_s / 2, P.blk_s / 2, P.h_axis + DATA.needle_d / 2, P.h_axis + DATA.needle_d / 2 + P.plate_t, M.sus));
  const end = BM.add(nd.Pc, BM.mul(A, P.back + DATA.tail));
  dyn.add(cylBetween(tip, end, DATA.needle_d / 2, nm));
  const C = [site.B0[0], 0, site.B0[2]];
  dyn.add(cylBetween([C[0], P.seat_top_Y - 3.3, C[2]], [C[0], P.seat_top_Y + 3, C[2]], 0.75, M.screw));
  const Pp = BM.add(BM.add(pose.B0, BM.mul(pose.a, P.push[0])), BM.mul(pose.s, P.push[1]));
  const e = BM.setScrew(site, P, st.rot, tilt);
  dyn.add(cylBetween(BM.add(Pp, BM.mul(pose.U, P.blk_h)), BM.sub(Pp, BM.mul(pose.U, e)), 0.75, tiltOut ? M.warn : M.screw));
  const q = site.pogo;
  dyn.add(cylBetween([q[0], yc, q[1]], [q[0], 10, q[1]], 0.5, M.pogo));
  const seat = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 3 - P.seat_top_Y, 32), M.peek);
  seat.position.set(C[0], (P.seat_top_Y + 3) / 2, C[2]); dyn.add(seat);
  const pad = new THREE.Mesh(new THREE.CylinderGeometry(DATA.pad_d / 2, DATA.pad_d / 2, 0.03, 32), M.pad);
  pad.position.set(site.padTrue[0], padY + 0.015, site.padTrue[1]); dyn.add(pad);
}
// static: floor (Al) with recess opening, wafer face, film plane
function statics() {
  const site = DATA.sites[$('site').value];
  for (const o of [...root.children]) if (o !== dyn) root.remove(o);
  const fl = new THREE.Mesh(new THREE.BoxGeometry(60, 0.5, 40), M.al);
  fl.position.set((site.B0[0] + site.padTrue[0]) / 2, 0.25, (site.B0[2] + site.padTrue[1]) / 2); root.add(fl);
  const film = new THREE.Mesh(new THREE.PlaneGeometry(W.x1 - W.x0, 2 * W.hz), M.film);
  film.position.set((W.x0 + W.x1) / 2, W.y_film, 0); film.rotation.x = Math.PI / 2; root.add(film);
  const waf = new THREE.Mesh(new THREE.BoxGeometry(25, 0.3, 25), M.wafer); waf.position.set(0, 0.5 + 0.15, 0); root.add(waf);
}
function frameCam() {
  statics();
  const site = DATA.sites[$('site').value];
  const mid = [(site.B0[0] + site.padTrue[0]) / 2, -1, (site.B0[2] + site.padTrue[1]) / 2];
  const t = new THREE.Vector3(mid[0], mid[2], -mid[1]);
  controls.target.copy(t);
  camera.position.set(t.x + 22, t.y + 18 * Math.sign(site.B0[2] || 1), t.z + 26);
  controls.update();
}
function resize() { const w = window.innerWidth, h = window.innerHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize); resize();
frameCam(); applyLang();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
