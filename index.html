const panel = document.getElementById('panel');
document.getElementById('hide').onclick = () => { panel.classList.toggle('min'); const b = document.getElementById('hide'); b.dataset.ko = panel.classList.contains('min') ? '더 보기' : '접기'; b.dataset.en = panel.classList.contains('min') ? 'More' : 'Less'; applyLang(); resize(); };
